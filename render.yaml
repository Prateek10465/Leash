# Optional: one-click hosted demo on Render. Runs in simulated mode unless you add secrets in the dashboard.
services:
  - type: web
    name: leash
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/state
    envVars:
      - key: BASE_URL
        sync: false   # set to your onrender.com URL so PayPal can redirect the approving human back
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: LEASH_MERCHANT_EMAIL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
